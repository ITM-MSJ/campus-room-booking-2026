name: Create assignment issues
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: assignment-issue-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing labels and issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/create_issues.py
